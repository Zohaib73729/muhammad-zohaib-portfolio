<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="weather-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="50%" stop-color="#0d2146"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="sky-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.2)"/>
      <stop offset="100%" stop-color="rgba(30, 58, 138, 0.35)"/>
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="weather-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#weather-bg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="650" cy="100" r="150" fill="#0284c7" opacity="0.15" filter="url(#weather-glow)"/>
  <circle cx="150" cy="380" r="160" fill="#6366f1" opacity="0.12" filter="url(#weather-glow)"/>

  <!-- Window Frame -->
  <rect x="50" y="40" width="700" height="420" rx="16" fill="#0b172a" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>

  <!-- Window Bar -->
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#070e1b"/>
  <rect x="50" y="70" width="700" height="12" fill="#070e1b"/>
  <circle cx="75" cy="61" r="5" fill="#ef4444"/>
  <circle cx="95" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="115" cy="61" r="5" fill="#10b981"/>

  <!-- Search Bar inside App -->
  <rect x="200" y="50" width="400" height="24" rx="6" fill="#101e38" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
  <circle cx="218" cy="62" r="5" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  <line x1="222" y1="66" x2="227" y2="71" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="238" y="66" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Search city... e.g. Sahiwal, Lahore, London</text>

  <!-- Left Main Weather Card -->
  <g transform="translate(80, 105)">
    <rect width="360" height="325" rx="14" fill="url(#sky-card)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    
    <!-- Location Badge -->
    <rect x="25" y="25" width="130" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="0.8"/>
    <text x="40" y="43" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">📍 Sahiwal, PK</text>

    <text x="25" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Saturday, Clear Sky</text>
    <text x="25" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="800">28°<tspan font-size="30" fill="#38bdf8">C</tspan></text>

    <!-- Sun & Cloud Illustration -->
    <g transform="translate(240, 45)">
      <circle cx="50" cy="45" r="30" fill="url(#sun-grad)" filter="url(#weather-glow)"/>
      <path d="M25 65 A18 18 0 0 1 55 52 A22 22 0 0 1 85 62 A14 14 0 0 1 85 75 L25 75 Z" fill="#ffffff" opacity="0.9"/>
    </g>

    <line x1="25" y1="180" x2="335" y2="180" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Metrics Row -->
    <g transform="translate(25, 205)">
      <rect width="90" height="95" rx="8" fill="rgba(15, 23, 42, 0.5)"/>
      <text x="45" y="32" fill="#94a3b8" font-size="10" text-anchor="middle">HUMIDITY</text>
      <text x="45" y="58" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">48%</text>
      <text x="45" y="78" fill="#38bdf8" font-size="9" text-anchor="middle">Normal</text>
    </g>

    <g transform="translate(135, 205)">
      <rect width="90" height="95" rx="8" fill="rgba(15, 23, 42, 0.5)"/>
      <text x="45" y="32" fill="#94a3b8" font-size="10" text-anchor="middle">WIND</text>
      <text x="45" y="58" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">14<tspan font-size="11">km/h</tspan></text>
      <text x="45" y="78" fill="#38bdf8" font-size="9" text-anchor="middle">NW Breeze</text>
    </g>

    <g transform="translate(245, 205)">
      <rect width="90" height="95" rx="8" fill="rgba(15, 23, 42, 0.5)"/>
      <text x="45" y="32" fill="#94a3b8" font-size="10" text-anchor="middle">UV INDEX</text>
      <text x="45" y="58" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">5.2</text>
      <text x="45" y="78" fill="#f59e0b" font-size="9" text-anchor="middle">Moderate</text>
    </g>
  </g>

  <!-- Right Forecast & Details Column -->
  <g transform="translate(465, 105)">
    <rect width="255" height="325" rx="14" fill="#0d1b32" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    <text x="25" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">5-Day Outlook</text>

    <!-- Forecast item 1 -->
    <g transform="translate(20, 52)">
      <rect width="215" height="44" rx="8" fill="rgba(255,255,255,0.03)"/>
      <text x="15" y="27" fill="#cbd5e1" font-size="12">Today</text>
      <circle cx="105" cy="22" r="8" fill="#f59e0b"/>
      <text x="180" y="27" fill="#ffffff" font-size="12" font-weight="600">28° / 19°</text>
    </g>
    <!-- Forecast item 2 -->
    <g transform="translate(20, 106)">
      <rect width="215" height="44" rx="8" fill="rgba(255,255,255,0.03)"/>
      <text x="15" y="27" fill="#cbd5e1" font-size="12">Sunday</text>
      <circle cx="105" cy="22" r="8" fill="#38bdf8"/>
      <text x="180" y="27" fill="#ffffff" font-size="12" font-weight="600">26° / 18°</text>
    </g>
    <!-- Forecast item 3 -->
    <g transform="translate(20, 160)">
      <rect width="215" height="44" rx="8" fill="rgba(255,255,255,0.03)"/>
      <text x="15" y="27" fill="#cbd5e1" font-size="12">Monday</text>
      <circle cx="105" cy="22" r="8" fill="#f59e0b"/>
      <text x="180" y="27" fill="#ffffff" font-size="12" font-weight="600">29° / 20°</text>
    </g>
    <!-- Forecast item 4 -->
    <g transform="translate(20, 214)">
      <rect width="215" height="44" rx="8" fill="rgba(255,255,255,0.03)"/>
      <text x="15" y="27" fill="#cbd5e1" font-size="12">Tuesday</text>
      <circle cx="105" cy="22" r="8" fill="#818cf8"/>
      <text x="180" y="27" fill="#ffffff" font-size="12" font-weight="600">24° / 17°</text>
    </g>

    <!-- Real-time API tag -->
    <rect x="20" y="275" width="215" height="32" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <text x="127" y="296" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">⚡ Real-Time Meteorological API</text>
  </g>
</svg>
