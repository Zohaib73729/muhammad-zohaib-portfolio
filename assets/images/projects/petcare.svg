<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pet-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b24"/>
      <stop offset="50%" stop-color="#0f2937"/>
      <stop offset="100%" stop-color="#08141c"/>
    </linearGradient>
    <linearGradient id="pet-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pet-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="pet-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#pet-bg)"/>

  <!-- Glow orbs -->
  <circle cx="680" cy="140" r="160" fill="#14b8a6" opacity="0.12" filter="url(#pet-glow)"/>
  <circle cx="140" cy="380" r="140" fill="#f59e0b" opacity="0.09" filter="url(#pet-glow)"/>

  <!-- Mockup Window -->
  <rect x="50" y="40" width="700" height="420" rx="16" fill="#0c1d27" stroke="rgba(20, 184, 166, 0.3)" stroke-width="1.5"/>

  <!-- Window Bar -->
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#08131a"/>
  <rect x="50" y="70" width="700" height="12" fill="#08131a"/>
  <circle cx="75" cy="61" r="5" fill="#ef4444"/>
  <circle cx="95" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="115" cy="61" r="5" fill="#10b981"/>

  <!-- Browser URL Bar -->
  <rect x="150" y="50" width="420" height="22" rx="6" fill="#122735" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="170" y="66" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" opacity="0.85">https://petcare-veterinary-wellness.app</text>

  <!-- App Header inside Mockup -->
  <rect x="50" y="82" width="700" height="52" fill="#0a1922" stroke="rgba(20, 184, 166, 0.15)" stroke-width="1"/>
  <!-- Paw Logo -->
  <g transform="translate(80, 96)">
    <circle cx="8" cy="18" r="7" fill="url(#pet-teal)"/>
    <circle cx="4" cy="7" r="3.5" fill="url(#pet-teal)"/>
    <circle cx="13" cy="7" r="3.5" fill="url(#pet-teal)"/>
    <circle cx="20" cy="13" r="3.2" fill="url(#pet-teal)"/>
    <circle cx="-3" cy="13" r="3.2" fill="url(#pet-teal)"/>
  </g>
  <text x="112" y="114" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="16">Pet<tspan fill="#2dd4bf">Care</tspan></text>

  <!-- Nav links -->
  <text x="260" y="113" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Services</text>
  <text x="350" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Veterinarians</text>
  <text x="460" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Grooming</text>
  <text x="560" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Emergency 24/7</text>

  <!-- Book button -->
  <rect x="660" y="96" width="70" height="26" rx="6" fill="url(#pet-amber)"/>
  <text x="695" y="113" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Book Visit</text>

  <!-- Hero inside PetCare -->
  <g transform="translate(75, 150)">
    <rect width="650" height="120" rx="12" fill="rgba(20, 184, 166, 0.12)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1"/>
    <text x="25" y="35" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="1">DEDICATED COMPANION HEALTHCARE</text>
    <text x="25" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700">Compassionate Care For Happy, Healthy Pets</text>
    <text x="25" y="92" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Routine wellness checkups, professional styling, dental therapy, and 24/7 urgent care.</text>
    
    <!-- Visual cute animal emoji / badge -->
    <circle cx="580" cy="60" r="40" fill="rgba(245, 158, 11, 0.18)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <text x="580" y="72" font-size="34" text-anchor="middle">🐾</text>
  </g>

  <!-- Service Cards -->
  <!-- Service 1: Wellness & Vaccines -->
  <g transform="translate(75, 285)">
    <rect width="200" height="150" rx="10" fill="#0e2330" stroke="rgba(20, 184, 166, 0.2)" stroke-width="1"/>
    <circle cx="35" cy="35" r="16" fill="url(#pet-teal)"/>
    <text x="35" y="41" font-size="14" text-anchor="middle">🩺</text>
    <text x="65" y="39" fill="#ffffff" font-size="13" font-weight="700">Health Checkups</text>
    <text x="20" y="75" fill="#94a3b8" font-size="11">Comprehensive exams, essential vaccinations, and parasite screening.</text>
    <rect x="20" y="112" width="85" height="22" rx="4" fill="rgba(20, 184, 166, 0.2)"/>
    <text x="62" y="126" fill="#5eead4" font-size="10" font-weight="600" text-anchor="middle">Learn More →</text>
  </g>

  <!-- Service 2: Bathing & Grooming -->
  <g transform="translate(300, 285)">
    <rect width="200" height="150" rx="10" fill="#0e2330" stroke="rgba(20, 184, 166, 0.2)" stroke-width="1"/>
    <circle cx="35" cy="35" r="16" fill="url(#pet-amber)"/>
    <text x="35" y="41" font-size="14" text-anchor="middle">✂️</text>
    <text x="65" y="39" fill="#ffffff" font-size="13" font-weight="700">Spa &amp; Grooming</text>
    <text x="20" y="75" fill="#94a3b8" font-size="11">Gentle warm baths, shedding treatment, claw trims, and ear hygiene.</text>
    <rect x="20" y="112" width="85" height="22" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="62" y="126" fill="#fcd34d" font-size="10" font-weight="600" text-anchor="middle">Learn More →</text>
  </g>

  <!-- Service 3: Nutrition & Dentistry -->
  <g transform="translate(525, 285)">
    <rect width="200" height="150" rx="10" fill="#0e2330" stroke="rgba(20, 184, 166, 0.2)" stroke-width="1"/>
    <circle cx="35" cy="35" r="16" fill="url(#pet-teal)"/>
    <text x="35" y="41" font-size="14" text-anchor="middle">🦴</text>
    <text x="65" y="39" fill="#ffffff" font-size="13" font-weight="700">Dental &amp; Diet</text>
    <text x="20" y="75" fill="#94a3b8" font-size="11">Ultrasonic tartar cleaning, personalized weight loss, and diet planning.</text>
    <rect x="20" y="112" width="85" height="22" rx="4" fill="rgba(20, 184, 166, 0.2)"/>
    <text x="62" y="126" fill="#5eead4" font-size="10" font-weight="600" text-anchor="middle">Learn More →</text>
  </g>
</svg>
