<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1917"/>
      <stop offset="50%" stop-color="#0f2e24"/>
      <stop offset="100%" stop-color="#071b15"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)"/>
      <stop offset="100%" stop-color="rgba(6, 78, 59, 0.3)"/>
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(16, 185, 129, 0.08)" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="680" cy="120" r="160" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="120" cy="400" r="140" fill="#00f2fe" opacity="0.08" filter="url(#glow)"/>

  <!-- Mockup Browser Window -->
  <rect x="50" y="40" width="700" height="420" rx="16" fill="#0c1614" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>

  <!-- Browser Header Bar -->
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#08100e"/>
  <rect x="50" y="70" width="700" height="12" fill="#08100e"/>
  <circle cx="75" cy="61" r="5" fill="#ef4444"/>
  <circle cx="95" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="115" cy="61" r="5" fill="#10b981"/>

  <!-- Browser URL Bar -->
  <rect x="150" y="50" width="420" height="22" rx="6" fill="#12231e" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="170" y="66" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" opacity="0.85">https://agromart-agricultural-supplies.store</text>

  <!-- App Header / Navbar inside Mockup -->
  <rect x="50" y="82" width="700" height="54" fill="#0a1a15" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1"/>
  <!-- Logo -->
  <circle cx="85" cy="109" r="14" fill="url(#accent-green)"/>
  <path d="M85 101 C81 105 80 111 85 116 C90 111 89 105 85 101 Z" fill="#ffffff"/>
  <text x="108" y="114" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16">Agro<tspan fill="#34d399">Mart</tspan></text>

  <!-- Nav links -->
  <text x="250" y="113" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Fertilizers</text>
  <text x="340" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Pest Sprays</text>
  <text x="440" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Organic Seeds</text>
  <text x="550" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Supplies</text>
  <!-- Cart badge -->
  <rect x="670" y="97" width="55" height="26" rx="6" fill="url(#accent-green)"/>
  <text x="686" y="114" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11">Cart (3)</text>

  <!-- Hero Banner inside Mockup -->
  <rect x="75" y="152" width="650" height="110" rx="12" fill="url(#card-grad)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
  <text x="100" y="185" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" letter-spacing="1">PREMIUM AGRICULTURAL SOLUTIONS</text>
  <text x="100" y="215" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20">Modern Farming &amp; Crop Care Store</text>
  <text x="100" y="238" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Supplying high-grade fertilizers, insect sprays, and bio-nutrients directly to growers.</text>

  <!-- Product Cards Grid -->
  <!-- Card 1: Urea & NPK Fertilizer -->
  <g transform="translate(75, 278)">
    <rect width="148" height="162" rx="10" fill="#0d1f19" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
    <rect x="12" y="12" width="124" height="74" rx="8" fill="#081410"/>
    <!-- Fertilizer bag icon -->
    <path d="M60 30 L88 30 L94 72 L54 72 Z" fill="#10b981" opacity="0.8"/>
    <text x="74" y="55" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">NPK</text>
    <text x="14" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Bio Fertilizer 50kg</text>
    <text x="14" y="122" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">PKR 4,850</text>
    <rect x="14" y="132" width="120" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="0.7"/>
    <text x="74" y="146" fill="#6ee7b7" font-size="9" text-anchor="middle" font-weight="bold">Order Now</text>
  </g>

  <!-- Card 2: Pest Protection Spray -->
  <g transform="translate(242, 278)">
    <rect width="148" height="162" rx="10" fill="#0d1f19" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
    <rect x="12" y="12" width="124" height="74" rx="8" fill="#081410"/>
    <!-- Spray can icon -->
    <rect x="65" y="38" width="18" height="34" rx="3" fill="#06b6d4" opacity="0.85"/>
    <path d="M74 38 L74 30 M68 30 L80 30" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
    <text x="14" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Crop Spray Max 1L</text>
    <text x="14" y="122" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">PKR 1,650</text>
    <rect x="14" y="132" width="120" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="0.7"/>
    <text x="74" y="146" fill="#6ee7b7" font-size="9" text-anchor="middle" font-weight="bold">Order Now</text>
  </g>

  <!-- Card 3: Micronutrient Booster -->
  <g transform="translate(410, 278)">
    <rect width="148" height="162" rx="10" fill="#0d1f19" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
    <rect x="12" y="12" width="124" height="74" rx="8" fill="#081410"/>
    <circle cx="74" cy="49" r="20" fill="url(#accent-green)" opacity="0.7"/>
    <text x="74" y="53" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">Zn+</text>
    <text x="14" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Zinc &amp; Boron Liquid</text>
    <text x="14" y="122" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">PKR 2,100</text>
    <rect x="14" y="132" width="120" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="0.7"/>
    <text x="74" y="146" fill="#6ee7b7" font-size="9" text-anchor="middle" font-weight="bold">Order Now</text>
  </g>

  <!-- Card 4: Farm Tool Kit -->
  <g transform="translate(577, 278)">
    <rect width="148" height="162" rx="10" fill="#0d1f19" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
    <rect x="12" y="12" width="124" height="74" rx="8" fill="#081410"/>
    <rect x="58" y="36" width="32" height="26" rx="4" fill="#10b981" opacity="0.65"/>
    <text x="74" y="53" fill="#ffffff" font-size="11" text-anchor="middle">TOOL</text>
    <text x="14" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Nozzle Spray Kit</text>
    <text x="14" y="122" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">PKR 1,200</text>
    <rect x="14" y="132" width="120" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="0.7"/>
    <text x="74" y="146" fill="#6ee7b7" font-size="9" text-anchor="middle" font-weight="bold">Order Now</text>
  </g>
</svg>
