<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="port-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="neon-cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.7)"/>
      <stop offset="100%" stop-color="rgba(30, 41, 59, 0.4)"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#port-bg)"/>

  <!-- Glowing background elements -->
  <circle cx="700" cy="180" r="180" fill="#00d2ff" opacity="0.12" filter="url(#neon-glow)"/>
  <circle cx="150" cy="350" r="150" fill="#9d4edd" opacity="0.1" filter="url(#neon-glow)"/>

  <!-- Mockup Window -->
  <rect x="50" y="40" width="700" height="420" rx="16" fill="#0f172a" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1.5"/>

  <!-- Window Bar -->
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#090d16"/>
  <rect x="50" y="70" width="700" height="12" fill="#090d16"/>
  <circle cx="75" cy="61" r="5" fill="#ef4444"/>
  <circle cx="95" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="115" cy="61" r="5" fill="#10b981"/>

  <!-- Portfolio Header inside Mockup -->
  <rect x="50" y="82" width="700" height="52" fill="#0c121e" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <!-- MZ Logo -->
  <rect x="80" y="94" width="28" height="28" rx="7" fill="url(#neon-cyan-purple)"/>
  <text x="94" y="113" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="13" text-anchor="middle">MZ</text>
  <text x="120" y="113" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14">Muhammad Zohaib</text>

  <!-- Nav links -->
  <text x="380" y="113" fill="#00d2ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Home</text>
  <text x="435" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">About</text>
  <text x="490" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Skills</text>
  <text x="545" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Projects</text>
  <text x="610" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Education</text>
  <!-- Theme switch toggle in mockup -->
  <circle cx="685" cy="108" r="10" fill="#1e293b" stroke="rgba(0,210,255,0.4)" stroke-width="1"/>
  <text x="685" y="112" font-size="9" text-anchor="middle">🌙</text>

  <!-- Hero mockup area -->
  <!-- Left Hero content -->
  <g transform="translate(80, 160)">
    <rect width="130" height="24" rx="12" fill="rgba(0, 210, 255, 0.12)" stroke="rgba(0, 210, 255, 0.3)" stroke-width="0.8"/>
    <text x="65" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">✨ HELLO, I'M</text>
    
    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">Muhammad Zohaib</text>
    
    <text x="0" y="95" fill="#00d2ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Frontend Developer</text>
    
    <text x="0" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">BSCS 4th Semester Student at COMSATS University Sahiwal.</text>
    <text x="0" y="142" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Crafting modern, responsive web experiences &amp; interfaces.</text>

    <!-- CTAs -->
    <rect x="0" y="170" width="130" height="34" rx="8" fill="url(#neon-cyan-purple)"/>
    <text x="65" y="191" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">View Projects</text>

    <rect x="145" y="170" width="115" height="34" rx="8" fill="transparent" stroke="rgba(0, 210, 255, 0.4)" stroke-width="1"/>
    <text x="202" y="191" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Contact Me</text>
  </g>

  <!-- Right Hero Portrait Frame in mockup -->
  <g transform="translate(480, 150)">
    <!-- Glow aura -->
    <rect width="210" height="240" rx="16" fill="rgba(0, 210, 255, 0.08)" stroke="url(#neon-cyan-purple)" stroke-width="2"/>
    <rect x="8" y="8" width="194" height="224" rx="12" fill="#15213b"/>
    <!-- Mock portrait avatar representation -->
    <circle cx="105" cy="90" r="45" fill="#1e293b" stroke="rgba(0,210,255,0.3)" stroke-width="2"/>
    <path d="M65 190 C65 145 145 145 145 190 Z" fill="#253554"/>
    <text x="105" y="98" fill="#38bdf8" font-size="28" text-anchor="middle">👨‍💻</text>
    
    <!-- Floating status badge -->
    <rect x="15" y="185" width="164" height="28" rx="8" fill="rgba(11, 15, 25, 0.9)" stroke="rgba(0, 210, 255, 0.4)" stroke-width="0.8"/>
    <circle cx="28" cy="199" r="4" fill="#10b981"/>
    <text x="38" y="202" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">COMSATS Sahiwal • 4th Sem</text>
  </g>

  <!-- Code snippet decoration badge -->
  <g transform="translate(80, 390)">
    <rect width="320" height="36" rx="8" fill="#090d16" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="20" y="22" fill="#a855f7" font-family="monospace" font-size="11">const <tspan fill="#38bdf8">developer</tspan> = { <tspan fill="#6ee7b7">status</tspan>: <tspan fill="#fef08a">"Ready to Build"</tspan> };</text>
  </g>
</svg>
